# Whisper service: N API replicas behind one nginx address. Each replica runs the model in its own process,
# so RAM use is per replica; the downloaded weights are shared through the models volume.
# Start:  docker compose up -d --build          (callers use http://<host>:9230)
# Scale:  WHISPER_REPLICAS=3 docker compose up -d --build, then: docker compose restart whisper_lb

name: whisper

services:
  whisper:
    build: .
    restart: unless-stopped
    mem_limit: ${WHISPER_MEM_LIMIT:-0}  # 0 = no cap; a cap makes an out-of-memory kill stay inside this container
    environment:
      WHISPER_ADMIN_PASSWORD: ${WHISPER_ADMIN_PASSWORD:-}
      WHISPER_NUM_THREAD: ${WHISPER_NUM_THREAD:-}
      WHISPER_REPLICAS: ${WHISPER_REPLICAS:-1}  # shown read-only on /admin/
    volumes:
      - models:/models
      - tokens:/data
    deploy:
      replicas: ${WHISPER_REPLICAS:-1}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9230/health')"]
      interval: 15s
      timeout: 5s
      start_period: 300s
    networks: [whisper]

  whisper_lb:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${WHISPER_PORT:-9230}:9230"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      whisper:
        condition: service_healthy
    networks: [whisper]

volumes:
  models:
  tokens:

networks:
  # Other stacks reach http://whisper_lb:9230 by joining this network.
  whisper:
